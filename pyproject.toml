[project]
name = "movieai-producer"
version = "0.1.0"
description = "Professional AI Film Production Platform"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.120,<1.0",
    "uvicorn[standard]>=0.38,<1.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.11,<3.0",
    "structlog>=25.4,<26.0",
    "sqlalchemy[asyncio]>=2.0.38,<3.0",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.14,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10.0",
    "httpx>=0.28,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"
